<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profilim</title>
<script src="/static/theme-boot.js"></script>
<link rel="stylesheet" href="/vendor/tabler/css/tabler.min.css">
<link rel="stylesheet" href="/vendor/tabler-icons/tabler-icons.min.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="page">
<div id="app-sidebar"></div>
<div class="page-wrapper">
  <div class="page-header d-print-none"><div class="container-xl">
    <div class="page-pretitle">Hesap ayarları</div><h2 class="page-title"><i class="ti ti-user-circle me-2"></i>Profilim</h2>
  </div></div>
  <div class="page-body"><div class="container-xl">
    <div class="row row-cards">
      <div class="col-lg-4">
        <div class="card">
          <div class="card-body text-center">
            <span class="avatar avatar-xl bg-primary-lt mb-3" id="avatar"></span>
            <h3 class="m-0 mb-1" id="pName"></h3>
            <div class="text-secondary" id="pEmail"></div>
            <div class="mt-3" id="pRole"></div>
            <div class="text-secondary small mt-2" id="pScope"></div>
          </div>
        </div>
      </div>
      <div class="col-lg-8">
        <div class="card mb-3">
          <div class="card-header"><h3 class="card-title">Kişisel Bilgiler</h3></div>
          <form id="profileForm"><div class="card-body"><div class="row g-3">
            <div class="col-md-6"><label class="form-label">Ad Soyad</label><input class="form-control" name="fullName" maxlength="120"></div>
            <div class="col-md-6"><label class="form-label">E-posta (giriş)</label><input class="form-control" name="email" type="email" maxlength="120"></div>
            <div class="col-md-6"><label class="form-label">Telefon</label><input class="form-control" name="phone" type="tel" maxlength="40"></div>
            <div class="col-md-6"><label class="form-label">Ünvan / Görev</label><input class="form-control" name="title" maxlength="80"></div>
            <div class="col-md-6" id="emailPwWrap" hidden><label class="form-label required">Mevcut şifre</label><input class="form-control" name="currentPassword" type="password" autocomplete="current-password"><div class="form-hint">E-posta değiştirmek için gerekli.</div></div>
          </div></div>
          <div class="card-footer text-end"><button class="btn btn-primary" type="submit">Kaydet</button></div></form>
        </div>

        <div class="card mb-3">
          <div class="card-header"><h3 class="card-title">Şifre Değiştir</h3></div>
          <form id="pwForm"><div class="card-body"><div class="row g-3">
            <div class="col-md-4"><label class="form-label">Mevcut şifre</label><input class="form-control" id="curPw" type="password" autocomplete="current-password" required></div>
            <div class="col-md-4"><label class="form-label">Yeni şifre</label><input class="form-control" id="newPw" type="password" autocomplete="new-password" required></div>
            <div class="col-md-4"><label class="form-label">Yeni şifre (tekrar)</label><input class="form-control" id="newPw2" type="password" autocomplete="new-password" required></div>
            <div class="col-12 form-hint">En az 8 karakter; en az bir harf ve bir rakam. Değişiklikten sonra diğer cihazlardaki oturumlarınız kapatılır.</div>
          </div></div>
          <div class="card-footer text-end"><button class="btn btn-primary" type="submit">Şifreyi Değiştir</button></div></form>
        </div>

        <div class="card" id="sessions">
          <div class="card-header"><h3 class="card-title">Aktif Oturumlar</h3>
            <div class="card-actions"><button class="btn btn-sm btn-ghost-danger" id="revokeOthersBtn"><i class="ti ti-logout me-1"></i>Diğer tüm oturumları kapat</button></div></div>
          <div class="list-group list-group-flush" id="sessionList"></div>
        </div>
      </div>
    </div>
  </div></div>
</div></div>
<script src="/vendor/tabler/js/tabler.min.js"></script>
<script src="/static/app.js"></script>
<script>
var e = App.escapeHtml, $ = function(id){ return document.getElementById(id); }, originalEmail = '';
function device(ua){
  ua = ua || '';
  var os = /Android/.test(ua) ? 'Android' : /iPhone|iPad/.test(ua) ? 'iOS' : /Windows/.test(ua) ? 'Windows' : /Mac OS/.test(ua) ? 'macOS' : /Linux/.test(ua) ? 'Linux' : 'Bilinmeyen';
  var br = /Edg\//.test(ua) ? 'Edge' : /Chrome\//.test(ua) ? 'Chrome' : /Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : 'Tarayıcı';
  return {text: br + ' · ' + os, icon: /Android|iPhone|iPad/.test(ua) ? 'ti-device-mobile' : 'ti-device-desktop'};
}
function loadSessions(){
  App.apiRequest('GET', '/api/me/sessions').then(function(list){
    $('sessionList').innerHTML = list.map(function(s){
      var d = device(s.userAgent);
      return '<div class="list-group-item"><div class="row align-items-center"><div class="col-auto"><i class="ti ' + d.icon + ' fs-1 text-secondary"></i></div>' +
        '<div class="col"><div>' + e(d.text) + (s.current ? ' <span class="badge bg-green-lt">bu cihaz</span>' : '') + '</div>' +
        '<div class="small text-secondary">' + e(s.ip || '') + ' · giriş ' + App.formatDate(s.createdAt) + ' · son işlem ' + App.formatRelative(s.lastActivity) + '</div></div>' +
        '<div class="col-auto">' + (s.current ? '' : '<button class="btn btn-sm btn-ghost-danger" data-revoke="' + s.id + '">Kapat</button>') + '</div></div></div>';
    }).join('');
  });
}
$('sessionList').addEventListener('click', function(ev){
  var b = ev.target.closest('[data-revoke]');
  if (b) App.apiRequest('DELETE', '/api/me/sessions/' + b.dataset.revoke).then(loadSessions);
});
$('revokeOthersBtn').addEventListener('click', function(){
  App.confirm('Bu cihaz dışındaki tüm oturumlarınız kapatılsın mı?').then(function(ok){
    if (ok) App.apiRequest('POST', '/api/me/sessions/revoke-others', {}).then(function(r){ App.toast(r.revoked + ' oturum kapatıldı.'); loadSessions(); });
  });
});
$('profileForm').querySelector('[name=email]').addEventListener('input', function(){ $('emailPwWrap').hidden = this.value.trim().toLowerCase() === originalEmail; });
$('profileForm').addEventListener('submit', function(ev){
  ev.preventDefault();
  var data = App.formData(ev.target);
  App.apiRequest('POST', '/api/me', data).then(function(){ App.toast('Profil kaydedildi.'); setTimeout(function(){ location.reload(); }, 800); })
    .catch(function(err){ App.toast(err.message, 'danger'); });
});
$('pwForm').addEventListener('submit', function(ev){
  ev.preventDefault();
  if ($('newPw').value !== $('newPw2').value){ App.toast('Yeni şifreler aynı değil.', 'danger'); return; }
  App.apiRequest('POST', '/api/me/password', {currentPassword: $('curPw').value, newPassword: $('newPw').value})
    .then(function(txt){ App.toast(txt); ev.target.reset(); loadSessions(); })
    .catch(function(err){ App.toast(err.message, 'danger'); });
});
App.meReady.then(function(me){
  originalEmail = (me.email || '').toLowerCase();
  $('avatar').textContent = (me.displayName || '?').split(/[\s@.]+/).filter(Boolean).slice(0, 2).map(function(s){ return s[0].toUpperCase(); }).join('');
  $('pName').textContent = me.fullName || me.displayName;
  $('pEmail').textContent = me.email || me.username;
  $('pRole').innerHTML = App.roleBadge(me.role);
  $('pScope').textContent = me.dealerName ? me.dealerName + (me.branchName ? ' / ' + me.branchName : ' (tüm şubeler)') : 'Merkez';
  App.fillForm($('profileForm'), {fullName: me.fullName, email: me.email, phone: me.phone, title: me.title});
  if (!me.email) App.toast('Hesabınıza henüz e-posta tanımlı değil. Giriş için e-postanızı ekleyin.', 'warning');
  loadSessions();
});
</script>
</body>
</html>
