<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giriş · E-Paper Yönetim</title>
<script src="/static/theme-boot.js"></script>
<link rel="stylesheet" href="/vendor/tabler/css/tabler.min.css">
<link rel="stylesheet" href="/vendor/tabler-icons/tabler-icons.min.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="d-flex flex-column auth-bg">
<div class="page page-center">
  <div class="container container-tight py-4">
    <div class="text-center mb-4">
      <span class="d-inline-flex align-items-center gap-2 fs-2 fw-bold">
        <span class="avatar avatar-md" style="background:linear-gradient(135deg,#4f6ef7,#8b5cf6);color:#fff"><i class="ti ti-tags fs-2"></i></span>
        E-Paper Yönetim
      </span>
    </div>
    <div class="card card-md shadow-sm">
      <div class="card-body">
        <h2 class="h2 text-center mb-2">Hesabınıza giriş yapın</h2>
        <p class="text-secondary text-center mb-4">E-paper etiket, gateway ve cihaz yönetim paneli</p>
        <div class="alert alert-danger" id="loginError" hidden></div>
        <form method="POST" action="/login" autocomplete="on">
          <input type="hidden" name="next" id="nextInput">
          <div class="mb-3">
            <label class="form-label" for="email">E-posta</label>
            <div class="input-icon">
              <span class="input-icon-addon"><i class="ti ti-mail"></i></span>
              <input type="text" class="form-control" id="email" name="email" placeholder="ornek@firma.com" autocomplete="username" required autofocus>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Şifre</label>
            <div class="input-group input-group-flat">
              <span class="input-group-text"><i class="ti ti-lock"></i></span>
              <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
              <span class="input-group-text"><a href="#" class="link-secondary" id="togglePw" title="Şifreyi göster"><i class="ti ti-eye"></i></a></span>
            </div>
          </div>
          <div class="form-footer">
            <button type="submit" class="btn btn-primary w-100"><i class="ti ti-login-2 me-1"></i>Giriş Yap</button>
          </div>
        </form>
      </div>
    </div>
    <div class="text-center text-secondary mt-3 small">Şifrenizi unuttuysanız bayi yöneticinize veya merkeze başvurun.</div>
  </div>
</div>
<script>
var params = new URLSearchParams(location.search);
document.getElementById('nextInput').value = params.get('next') || '/';
var err = params.get('err');
if (err){
  var el = document.getElementById('loginError');
  el.textContent = ({
    limit: 'Çok fazla hatalı deneme yapıldı. 15 dakika sonra tekrar deneyin.',
    locked: 'Hesabınız art arda hatalı denemeler nedeniyle 15 dakikalığına kilitlendi. Daha sonra tekrar deneyin veya yöneticinize başvurun.',
    inactive: 'Hesabınız (veya bayiniz/şubeniz) pasif durumda. Yöneticinize başvurun.'
  })[err] || 'E-posta veya şifre hatalı.';
  el.hidden = false;
}
document.getElementById('togglePw').addEventListener('click', function(e){
  e.preventDefault();
  var i = document.getElementById('password');
  i.type = i.type === 'password' ? 'text' : 'password';
  this.firstChild.className = 'ti ' + (i.type === 'password' ? 'ti-eye' : 'ti-eye-off');
});
</script>
</body>
</html>
