<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Şifre Belirle</title>
<script src="/static/theme-boot.js"></script>
<link rel="stylesheet" href="/vendor/tabler/css/tabler.min.css">
<link rel="stylesheet" href="/vendor/tabler-icons/tabler-icons.min.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="d-flex flex-column auth-bg">
<div class="page page-center">
  <div class="container container-tight py-4">
    <div class="card card-md shadow-sm">
      <div class="card-body">
        <div class="text-center mb-3"><span class="avatar avatar-lg bg-primary-lt"><i class="ti ti-shield-lock fs-1"></i></span></div>
        <h2 class="h2 text-center mb-2">Yeni şifrenizi belirleyin</h2>
        <p class="text-secondary text-center mb-4" id="intro">Güvenliğiniz için size verilen geçici şifreyi değiştirmeniz gerekiyor.</p>
        <form id="pwForm">
          <div class="mb-3">
            <label class="form-label" for="curPw">Mevcut (geçici) şifre</label>
            <input type="password" class="form-control" id="curPw" autocomplete="current-password" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="newPw">Yeni şifre</label>
            <input type="password" class="form-control" id="newPw" autocomplete="new-password" required>
            <div class="form-hint">En az 8 karakter; en az bir harf ve bir rakam içermeli.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="newPw2">Yeni şifre (tekrar)</label>
            <input type="password" class="form-control" id="newPw2" autocomplete="new-password" required>
          </div>
          <div class="alert alert-danger" id="pwMsg" hidden></div>
          <div class="form-footer d-flex gap-2">
            <a href="/logout" class="btn btn-link link-secondary">Çıkış</a>
            <button type="submit" class="btn btn-primary flex-fill" id="saveBtn">Şifreyi Kaydet ve Devam Et</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<script src="/vendor/tabler/js/tabler.min.js"></script>
<script src="/static/app.js"></script>
<script>
App.meReady.then(function(me){
  document.getElementById('intro').textContent = 'Merhaba ' + me.displayName + '. Güvenliğiniz için size verilen geçici şifreyi değiştirmeniz gerekiyor.';
});
document.getElementById('pwForm').addEventListener('submit', function(e){
  e.preventDefault();
  var a = document.getElementById('newPw').value, b = document.getElementById('newPw2').value;
  if (a !== b){ App.showMsg('pwMsg', false, 'Yeni şifreler birbiriyle aynı değil.'); return; }
  var btn = document.getElementById('saveBtn');
  App.setBusy(btn, true);
  App.apiRequest('POST', '/api/me/password', {currentPassword: document.getElementById('curPw').value, newPassword: a})
    .then(function(){ location.href = '/'; })
    .catch(function(err){ App.setBusy(btn, false); App.showMsg('pwMsg', false, err.message); });
});
</script>
</body>
</html>
