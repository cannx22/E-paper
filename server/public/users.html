<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kullan&#305;c&#305; Y&ouml;netimi</title>
<link rel="stylesheet" href="/static/admin.css">
</head><body>
<div class="banner">
  <span class="tag">&#128101;</span>
  <div>
    <h1>Kullan&#305;c&#305; Y&ouml;netimi</h1>
    <p>Admin ve kullan&#305;c&#305; hesaplar&#305;n&#305; buradan y&ouml;netin.</p>
  </div>
  <nav id="nav" class="nav-links"></nav>
</div>
<div class="wrap">
  <section class="card">
    <h2>Mevcut Kullan&#305;c&#305;lar</h2>
    <div class="table-scroll">
      <table>
        <thead><tr><th>Kullan&#305;c&#305; Ad&#305;</th><th>Rol</th><th>Olu&#351;turulma</th><th></th></tr></thead>
        <tbody id="userBody"><tr><td colspan="4">Y&uuml;kleniyor...</td></tr></tbody>
      </table>
    </div>
    <div id="userMsg" class="msg"></div>
  </section>

  <section class="card">
    <h2>Yeni Kullan&#305;c&#305; Ekle</h2>
    <form id="addForm">
      <div class="row">
        <div>
          <label for="newUsername">Kullan&#305;c&#305; Ad&#305;</label>
          <input type="text" id="newUsername" required>
        </div>
        <div>
          <label for="newPassword">&#350;ifre (en az 6 karakter)</label>
          <input type="password" id="newPassword" required>
        </div>
        <div>
          <label for="newRole">Rol</label>
          <select id="newRole">
            <option value="user">Kullan&#305;c&#305; (sadece etiket g&ouml;nderme)</option>
            <option value="admin">Admin (her &#351;ey + y&ouml;netim)</option>
          </select>
        </div>
      </div>
      <button type="submit" class="btn-primary">Kullan&#305;c&#305; Ekle</button>
    </form>
    <div id="addMsg" class="msg"></div>
  </section>

  <section class="card">
    <h2>Kendi &#350;ifremi De&#287;i&#351;tir</h2>
    <form id="pwForm">
      <div class="row">
        <div>
          <label for="curPw">Mevcut &#350;ifre</label>
          <input type="password" id="curPw" required autocomplete="current-password">
        </div>
        <div>
          <label for="newPw">Yeni &#350;ifre</label>
          <input type="password" id="newPw" required autocomplete="new-password">
        </div>
      </div>
      <button type="submit" class="btn-primary">&#350;ifreyi De&#287;i&#351;tir</button>
    </form>
    <div id="pwMsg" class="msg"></div>
  </section>
</div>

<script src="/static/common.js"></script>
<script>
function showMsg(id, ok, text){
  var el = document.getElementById(id);
  el.className = 'msg ' + (ok ? 'ok' : 'err');
  el.textContent = text;
}

function refresh(){
  return apiRequest('GET', '/api/users').then(function(list){
    document.getElementById('userBody').innerHTML = list.map(function(u){
      var name = escapeHtml(u.username);
      var role = u.role === 'admin' ? '<span class="role-admin">Admin</span>' : '<span class="role-user">Kullan&#305;c&#305;</span>';
      return '<tr><td><b>' + name + '</b></td><td>' + role + '</td><td>' + formatDate(u.createdAt) + '</td>' +
        '<td><div class="actions">' +
        '<button class="btn-sm" data-act="password" data-user="' + name + '">&#350;ifre S&#305;f&#305;rla</button>' +
        '<button class="btn-sm danger" data-act="delete" data-user="' + name + '">Sil</button>' +
        '</div></td></tr>';
    }).join('');
  }).catch(function(err){ showMsg('userMsg', false, err.message); });
}

document.getElementById('userBody').addEventListener('click', function(e){
  var btn = e.target.closest('button[data-act]');
  if (!btn) return;
  var user = btn.dataset.user;
  var base = '/api/users/' + encodeURIComponent(user);
  var req;
  if (btn.dataset.act === 'password'){
    var pw = prompt(user + ' için yeni şifre (en az 6 karakter):');
    if (!pw) return;
    req = apiRequest('POST', base + '/password', {password: pw}).then(function(){
      showMsg('userMsg', true, user + ' kullanıcısının şifresi değiştirildi.');
    });
  } else {
    if (!confirm(user + ' silinsin mi?')) return;
    req = apiRequest('DELETE', base).then(function(){
      document.getElementById('userMsg').className = 'msg';
    });
  }
  req.then(refresh).catch(function(err){ showMsg('userMsg', false, err.message); });
});

document.getElementById('addForm').addEventListener('submit', function(e){
  e.preventDefault();
  apiRequest('POST', '/api/users', {
    username: document.getElementById('newUsername').value,
    password: document.getElementById('newPassword').value,
    role: document.getElementById('newRole').value
  }).then(function(){
    showMsg('addMsg', true, 'Kullanıcı eklendi.');
    e.target.reset();
    refresh();
  }).catch(function(err){ showMsg('addMsg', false, err.message); });
});

document.getElementById('pwForm').addEventListener('submit', function(e){
  e.preventDefault();
  apiRequest('POST', '/api/me/password', {
    currentPassword: document.getElementById('curPw').value,
    newPassword: document.getElementById('newPw').value
  }).then(function(txt){
    showMsg('pwMsg', true, txt);
    setTimeout(function(){ location.href = '/login'; }, 1500);
  }).catch(function(err){ showMsg('pwMsg', false, err.message); });
});

refresh();
</script>
</body></html>
