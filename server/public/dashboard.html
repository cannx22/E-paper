<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genel Bakış</title>
<script src="/static/theme-boot.js"></script>
<link rel="stylesheet" href="/vendor/tabler/css/tabler.min.css">
<link rel="stylesheet" href="/vendor/tabler-icons/tabler-icons.min.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="page">
<div id="app-sidebar"></div>
<div class="page-wrapper">
  <div class="page-header d-print-none"><div class="container-xl"><div class="row g-2 align-items-center">
    <div class="col"><div class="page-pretitle" id="scopeText">Genel durum</div><h2 class="page-title"><i class="ti ti-layout-dashboard me-2"></i><span id="greeting">Genel Bakış</span></h2></div>
  </div></div></div>

  <div class="page-body"><div class="container-xl">
    <div class="row row-deck row-cards" id="stats"></div>
    <div class="row g-3 mt-1" id="quickActions"></div>

    <div class="row row-cards mt-1">
      <div class="col-lg-5">
        <div class="card">
          <div class="card-header"><h3 class="card-title"><i class="ti ti-router me-2 text-secondary"></i>Gateway Durumları</h3></div>
          <div class="card-body">
            <div class="progress progress-separated mb-3" style="height:.7rem" id="gwBar"></div>
            <div class="row g-2" id="gwStats"></div>
          </div>
        </div>
      </div>
      <div class="col-lg-7">
        <div class="card">
          <div class="card-header"><h3 class="card-title"><i class="ti ti-alert-triangle me-2 text-warning"></i>Offline / Hatalı Gateway'ler</h3>
            <div class="card-actions"><a href="/gateways" class="btn btn-sm">Tümü</a></div></div>
          <div class="table-responsive">
            <table class="table table-vcenter card-table">
              <thead><tr><th>Gateway</th><th>Durum</th><th>Bayi / Şube</th><th>Son görülme</th></tr></thead>
              <tbody id="problemBody"><tr><td colspan="4" class="text-secondary">Yükleniyor...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div class="row row-cards mt-1">
      <div class="col-lg-5">
        <div class="card">
          <div class="card-header"><h3 class="card-title"><i class="ti ti-activity me-2 text-primary"></i>Son Aktivite</h3>
            <div class="card-actions"><a href="/history" class="btn btn-sm">Tümü</a></div></div>
          <ul class="activity" id="activity"><li class="text-secondary">Yükleniyor...</li></ul>
        </div>
      </div>
      <div class="col-lg-7">
        <div class="card">
          <div class="card-header"><h3 class="card-title"><i class="ti ti-circle-x me-2 text-danger"></i>Son Başarısız İşlemler</h3>
            <div class="card-actions"><a href="/history?type=failed" class="btn btn-sm">Tümü</a></div></div>
          <div class="table-responsive">
            <table class="table table-vcenter card-table">
              <thead><tr><th>Zaman</th><th>Kullanıcı</th><th>İşlem</th><th>Kaynak</th><th>Mesaj</th></tr></thead>
              <tbody id="failBody"><tr><td colspan="5" class="text-secondary">Yükleniyor...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div></div>
</div></div>
<script src="/vendor/tabler/js/tabler.min.js"></script>
<script src="/static/app.js"></script>
<script>
var e = App.escapeHtml;
// Dikey kart: ustte etiket + ikon, altta buyuk sayi ve aciklama (dar alanda da okunur).
function stat(value, label, icon, color, href, sub){
  return '<div class="col-6 col-md-4 col-lg-3 col-xxl"><a class="card card-sm stat-card stat-v card-link text-reset" href="' + href + '"><div class="card-body">' +
    '<div class="d-flex align-items-start justify-content-between gap-2"><div class="stat-label">' + label + '</div>' +
    '<span class="avatar avatar-sm bg-' + color + '-lt flex-shrink-0"><i class="ti ' + icon + '"></i></span></div>' +
    '<div class="stat-value mt-1">' + value + '</div>' +
    (sub ? '<div class="small text-secondary lh-sm mt-1 text-truncate">' + sub + '</div>' : '') + '</div></a></div>';
}
var ORDER = ['active', 'offline', 'error', 'awaiting', 'registered', 'pending', 'disabled'];
var COLORS = {active:'green', offline:'secondary', error:'red', awaiting:'azure', registered:'indigo', pending:'yellow', disabled:'dark'};

function refresh(){
  App.apiRequest('GET', '/api/dashboard').then(function(d){
    var c = d.counts, s = d.gatewaysByStatus, html = '';
    if (c.dealers !== undefined) html += stat(c.dealers, 'Bayi', 'ti-building-store', 'purple', '/dealers', c.dealersActive + ' aktif');
    html += stat(c.branches, 'Şube', 'ti-building', 'blue', currentUser.can['branch.view'] ? '/branches' : '#');
    html += stat(c.gateways, 'Gateway', 'ti-router', 'cyan', '/gateways', s.active + ' aktif, ' + (s.offline + s.error) + ' sorunlu');
    html += stat(c.devices, 'Cihaz', 'ti-tags', 'green', '/devices', c.devicesUnassigned + ' gateway\'siz');
    html += stat(c.pendingUpdates, 'Kuyrukta', 'ti-clock', c.pendingUpdates ? 'yellow' : 'secondary', '/updates', 'bekleyen güncelleme');
    html += stat(d.sends24h.ok, 'Başarılı', 'ti-circle-check', 'teal', '/history?type=labels', 'gönderim · 24 saat');
    html += stat(d.sends24h.failed, 'Başarısız', 'ti-circle-x', d.sends24h.failed ? 'red' : 'secondary', '/history?type=failed', 'gönderim · 24 saat');
    document.getElementById('stats').innerHTML = html;

    var total = ORDER.reduce(function(a, k){ return a + s[k]; }, 0) || 1;
    document.getElementById('gwBar').innerHTML = ORDER.filter(function(k){ return s[k]; }).map(function(k){
      return '<div class="progress-bar bg-' + COLORS[k] + '" style="width:' + (s[k] * 100 / total) + '%" title="' + e(d.statusLabels[k]) + ': ' + s[k] + '"></div>';
    }).join('');
    document.getElementById('gwStats').innerHTML = ORDER.map(function(k){
      return '<div class="col-6"><div class="d-flex align-items-center justify-content-between border rounded px-2 py-1">' +
        App.statusBadge(k, d.statusLabels[k]) + '<strong>' + s[k] + '</strong></div></div>';
    }).join('');

    document.getElementById('problemBody').innerHTML = d.problemGateways.length ? d.problemGateways.map(function(g){
      return '<tr class="cursor-pointer" onclick="location.href=\'/gateways/' + e(g.id) + '\'"><td><div class="fw-medium">' + e(g.name) + '</div><div class="small text-secondary mono">' + e(g.id) + '</div></td>' +
        '<td>' + App.statusBadge(g.status, g.statusLabel) + (g.lastError ? '<div class="small text-danger mt-1">' + e(g.lastError) + '</div>' : '') + '</td>' +
        '<td>' + e(g.dealerName || '-') + (g.branchName ? '<div class="small text-secondary">' + e(g.branchName) + '</div>' : '') + '</td>' +
        '<td title="' + e(App.formatDate(g.lastSeen)) + '">' + App.formatRelative(g.lastSeen) + '</td></tr>';
    }).join('') : App.emptyRow(4, 'Sorunlu gateway yok', 'ti-mood-happy');
  });
  App.apiRequest('GET', '/api/audit?type=failed&limit=8').then(function(list){
    document.getElementById('failBody').innerHTML = list.length ? list.map(function(a){
      return '<tr><td class="text-nowrap" title="' + e(App.formatDate(a.created_at)) + '">' + App.formatRelative(a.created_at) + '</td><td>' + e(a.username || '-') + '</td>' +
        '<td>' + e(App.AUDIT_LABELS[a.action] || a.action) + '</td><td>' + e(a.gateway_name || a.device_name || a.entity_id || '-') + '</td>' +
        '<td class="text-secondary">' + e((a.message || '').replace(/^HATA:\s*/, '')) + '</td></tr>';
    }).join('') : App.emptyRow(5, 'Başarısız işlem yok', 'ti-circle-check');
  });
}
function loadActivity(){
  App.apiRequest('GET', '/api/audit?limit=9').then(function(list){
    document.getElementById('activity').innerHTML = list.length ? list.map(function(a){
      var cls = a.success ? (a.action === 'label.send' ? 'ok' : '') : 'err';
      var what = a.gateway_name || a.device_name || a.entity_id || '';
      return '<li><span class="dot ' + cls + '"></span><div class="d-flex justify-content-between gap-2"><div class="min-w-0"><div class="fw-medium text-truncate">' + e(App.AUDIT_LABELS[a.action] || a.action) +
        (what ? ' <span class="text-secondary fw-normal">· ' + e(what) + '</span>' : '') + '</div><div class="small text-secondary text-truncate">' + e(a.username || 'sistem') + '</div></div>' +
        '<div class="small text-secondary text-nowrap">' + App.formatRelative(a.created_at) + '</div></div></li>';
    }).join('') : '<li class="text-secondary">Henüz aktivite yok.</li>';
  });
}
function quickActions(me){
  var qa = [
    me.can['label.send'] && ['/', 'ti-send', 'blue', 'Etiket Gönder', 'Tek etikete içerik gönder'],
    me.can['label.send'] && ['/devices', 'ti-stack-2', 'purple', 'Toplu Güncelleme', 'Cihaz seç, hepsine gönder'],
    me.can['device.manage'] && ['/devices?add=1', 'ti-scan', 'green', 'Cihaz Ekle', 'Barkod / QR ile hızlı ekle'],
    me.can['gateway.claim'] && !me.can['gateway.register'] && ['/gateways', 'ti-qrcode', 'cyan', 'Gateway Ekle', 'QR kodla sahiplen'],
    me.can['dealer.manage'] && ['/dealers', 'ti-building-store', 'orange', 'Yeni Bayi', 'Bayi ve ilk yöneticisini aç'],
    !me.can['label.send'] && ['/updates', 'ti-list-check', 'blue', 'Güncellemeler', 'Kuyruğu izle']
  ].filter(Boolean).slice(0, 4);
  document.getElementById('quickActions').innerHTML = qa.map(function(q){
    return '<div class="col-sm-6 col-xl-3"><a class="quick-action" href="' + q[0] + '"><span class="qa-icon bg-' + q[2] + '-lt"><i class="ti ' + q[1] + '"></i></span>' +
      '<span class="min-w-0"><div class="qa-title">' + q[3] + '</div><div class="qa-sub text-truncate">' + q[4] + '</div></span><i class="ti ti-chevron-right ms-auto text-secondary"></i></a></div>';
  }).join('');
}
App.meReady.then(function(me){
  var h = new Date().getHours();
  var hello = h < 6 ? 'İyi geceler' : h < 12 ? 'Günaydın' : h < 18 ? 'İyi günler' : 'İyi akşamlar';
  var first = (me.fullName || '').split(' ')[0];
  document.getElementById('greeting').textContent = hello + (first ? ', ' + first : '');
  document.getElementById('scopeText').textContent = new Date().toLocaleDateString('tr-TR', {weekday: 'long', day: 'numeric', month: 'long'}) + ' · ' +
    (me.dealerName ? me.dealerName + (me.branchName ? ' / ' + me.branchName : '') : 'Tüm sistem');
  quickActions(me);
  refresh(); loadActivity();
});
setInterval(loadActivity, 20000);
setInterval(refresh, 15000);
</script>
</body>
</html>
