<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gateway Ekle</title>
<link rel="stylesheet" href="/static/admin.css">
</head><body>
<div class="banner">
  <span class="tag">&#128225;</span>
  <div>
    <h1>Gateway Ekle</h1>
    <p>QR kodu okuttu&#287;unuz gateway'i hesab&#305;n&#305;za ekleyin.</p>
  </div>
  <nav id="nav" class="nav-links"></nav>
</div>
<div class="wrap" style="max-width:560px;">
  <section class="card">
    <h2>Gateway Bilgileri</h2>
    <form id="claimForm">
      <label for="claimId">Gateway Kimli&#287;i (MAC)</label>
      <input type="text" id="claimId" required>
      <label for="claimCode">Sahiplenme Kodu</label>
      <input type="text" id="claimCode" required>
      <label for="claimName">&#304;sim (&ouml;rnek: Kasa Yan&#305;)</label>
      <input type="text" id="claimName" maxlength="60">
      <div id="claimBranchWrap"><label for="claimBranch">&#350;ube</label><select id="claimBranch"></select></div>
      <button type="submit" class="btn-primary" style="width:100%;">Gateway'i Hesab&#305;ma Ekle</button>
    </form>
    <div id="claimMsg" class="msg"></div>
  </section>
</div>
<script src="/static/common.js"></script>
<script>
var params = new URLSearchParams(location.search);
document.getElementById('claimId').value = params.get('gw') || '';
document.getElementById('claimCode').value = params.get('code') || '';

meReady.then(function(me){
  if (me.branchId){
    document.getElementById('claimBranchWrap').style.display = 'none';
    return;
  }
  return apiRequest('GET', '/api/branches').then(function(list){
    fillSelect(document.getElementById('claimBranch'), list, '(şube yok / bayi seviyesi)');
  });
});

document.getElementById('claimForm').addEventListener('submit', function(e){
  e.preventDefault();
  apiRequest('POST', '/api/gateways/claim', {
    id: document.getElementById('claimId').value,
    code: document.getElementById('claimCode').value,
    name: document.getElementById('claimName').value,
    branchId: document.getElementById('claimBranch').value || null
  }).then(function(g){
    showMsg('claimMsg', true, g.name + ' hesabınıza eklendi. Durum: ' + g.statusLabel +
      (g.status === 'awaiting' ? '\nGateway\'i elektriğe takıp WiFi kurulumunu yapın; internete bağlanınca Aktif olacak.' : ''));
    setTimeout(function(){ location.href = '/gateways'; }, 3000);
  }).catch(function(err){ showMsg('claimMsg', false, err.message); });
});
</script>
</body></html>
